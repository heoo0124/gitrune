<!-- B2 笔画 38 —— 极简，只有一条主线 + 两个节点，最大化字母清晰度 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F7FE"/><stop offset="100%" stop-color="#CBDBF2"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="190" y1="380" x2="360" y2="150">
      <stop offset="0%" stop-color="#2F6BF5"/><stop offset="55%" stop-color="#4D8CFF"/>
      <stop offset="100%" stop-color="#3FE09B"/>
    </linearGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 262 192 A 72 72 0 1 0 262 320" stroke-width="38"/>
        <path d="M 262 256 L 206 256" stroke-width="38"/>
        <path d="M 300 174 L 300 338" stroke-width="38"/>
        <path d="M 300 174 L 350 174 A 44 44 0 0 1 350 256 L 300 256" stroke-width="38"/>
        <path d="M 330 256 L 372 338" stroke-width="38"/>
      </g>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0B1220"/>
  <g fill="none" stroke="url(#flow)" stroke-width="24" stroke-linecap="round">
    <path d="M 200 366 L 200 240 Q 200 176 264 176 L 340 176"/>
  </g>
  <g fill="#0B1220" stroke="url(#flow)" stroke-width="12">
    <circle cx="200" cy="366" r="22"/>
    <circle cx="340" cy="176" r="22"/>
  </g>
  <circle cx="268" cy="256" r="25" fill="#FFFFFF"/>

  <rect width="512" height="512" rx="112" fill="url(#plate)" mask="url(#cut)"/>
</svg>
