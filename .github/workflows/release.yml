name: Release

# Builds the desktop bundles for a version tag and attaches them to a GitHub release.
# Windows and Linux bundles are published unsigned: the app is ad-hoc signed on macOS,
# so first launch needs the Gatekeeper step documented in README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-13
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Tauri's Linux bundle needs these; webkit2gtk-4.1 is the Tauri 2 default.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - run: pnpm install --frozen-lockfile

      # Builds the frontend, the bundles, and on macOS signs the .app and rebuilds
      # the .dmg around it: tauri's own pass leaves the linker signature, which
      # seals no resources and Gatekeeper rejects.
      - name: Build
        shell: bash
        run: scripts/bundle-release.sh --target ${{ matrix.target }}
        env:
          # Ad-hoc unless the repository supplies a real certificate.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Keep only installable bundles; skip the .app.tar.gz updater payloads.
          find target -path '*/bundle/dmg/*.dmg' -o \
                    -path '*/bundle/msi/*.msi' -o \
                    -path '*/bundle/nsis/*-setup.exe' -o \
                    -path '*/bundle/deb/*.deb' -o \
                    -path '*/bundle/rpm/*.rpm' -o \
                    -path '*/bundle/appimage/*.AppImage' \
            | while read -r f; do cp "$f" dist-release/; done
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GitRune ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          files: all/*
          body: |
            Desktop bundles for Linux, macOS and Windows.

            **macOS:** the app is ad-hoc signed, so the first launch needs
            System Settings → Privacy & Security → "Open Anyway", or:

            ```sh
            xattr -d com.apple.quarantine /Applications/GitRune.app
            ```

            **Linux:** the `.deb` / `.rpm` packages install the app; the
            `.AppImage` runs without installing.

            **Windows:** the `-setup.exe` is the installer; the `.msi` works with
            group policy.
